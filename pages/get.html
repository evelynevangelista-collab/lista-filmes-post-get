<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Lista de filmes</title>
        <link rel="stylesheet" href="../css/get.css" />
        <script src="../js/get.js" defer></script>
    </head>
    
    <body>
        <header>
            <h1>Lista de Filmes</h1>
            <p>Filmes abaixo</p>
        </header>
        <main>
            <a href="../index.html">Voltar para o cadastro</a>
            <section id="galeria">
                <section id="galeria-titulo">
                    <h2 id="titulo-lista">Filmes cadastrados</h2>
                    <p id="resposta"></p>
                </section>
                <ul id="lista-filmes"></ul> 
            </section>
        </main>
                
                <template id="modelo-filme">
            <li>
                <section class="card-capa">
                    <img class="imagem-filme" alt="" />
                </section>
                <section class="card-conteudo">
                    <h3 class="nome"></h3>
                    <p>Gênero: <span class="genero"> </span></p>
                    <p>Plataforma: <span class="plataforma"> </span></p>
                    <p>Ano de lançamento: <span class="ano_lancamento"> </span></p>
                    <p>Desenvolvedora: <span class="desenvolvedora"> </span></p>
                </section>
            </li>
        </template>

        <footer>
            <p>Prática de formulários HTML.</p>
        </footer>
    </body>
</html>
